<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adi Prathapa | 404</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/shared-footer.css" />
    <style>
      :root {
        --bg: #E4EFF5;
        --ink: #111827;
        --muted: #4b5563;
        --cta: #0671A4;
        --cta-hover: #055a84;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Poppins', sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main.wrap {
        min-height: 100vh;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 3rem;
      }
      .copy { display: flex; flex-direction: column; gap: 1.5rem; }
      .tagline {
        font-size: 1.05rem;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0.01em;
      }
      .heading {
        font-family: 'Poppins', sans-serif;
        font-weight: 400;
        font-size: clamp(3rem, 6vw, 4.5rem);
        line-height: 1.2;
        letter-spacing: -0.025em;
        background: linear-gradient(135deg, #0671A4 0%, #1a9fd4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
      }
      .home {
        align-self: flex-start;
        margin-top: 0.5rem;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: var(--cta);
        color: #fff;
        text-decoration: none;
        font-family: 'Poppins', sans-serif;
        font-weight: 500;
        font-size: 1rem;
        padding: 0.5rem 1.1rem;
        border: 2px solid transparent;
        border-radius: 0.75rem;
        box-shadow: 0 2px 8px rgba(6, 113, 164, 0.12);
        transition: background-color 0.3s, color 0.3s, border-color 0.3s;
      }
      .home:hover { background: var(--cta-hover); }
      .home svg { display: block; }
      .home .icon-arrow { display: none; }
      .home:hover .icon-chevron { display: none; }
      .home:hover .icon-arrow { display: block; }
      .art {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .art img {
        width: 100%;
        max-width: 520px;
        height: auto;
        display: block;
        image-rendering: auto;
      }
      @media (max-width: 760px) {
        main.wrap {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 1.5rem;
          padding: 1.5rem;
        }
        .art { order: -1; }
        .art img { max-width: 320px; }
        .copy { align-items: center; text-align: center; }
        .home { align-self: center; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="copy">
        <p class="tagline">Sorry, we couldn't find that page.</p>
        <h1 class="heading">Error 404</h1>
        <a class="home" href="/">
          <span>Go Home</span>
          <svg class="icon-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 5l7 7-7 7" />
          </svg>
          <svg class="icon-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="M12 5l7 7-7 7" />
          </svg>
        </a>
      </div>
      <div class="art">
        <img src="/bugcat-capoo.gif" alt="bugcat capoo" />
      </div>
    </main>

    <footer class="video-footer">
      <div class="video-footer__inner">
        <div class="video-footer__word" aria-label="आदि" style="visibility:hidden">
          <video class="video-footer__media" src="/footer-letters.mp4" poster="/footer-letters-poster.jpg" autoplay muted loop playsinline preload="auto"></video>
        </div>

        <div class="video-footer__content">
          <div class="video-footer__columns">
            <nav aria-label="Footer navigation">
              <h4>Explore</h4>
              <a href="/#about">About</a>
              <a href="/#projects">Projects</a>
              <a href="/#experience">Experience</a>
              <a href="/#contact">Contact</a>
            </nav>

            <nav aria-label="Resources">
              <h4>Resources</h4>
              <a href="/resume.html">Resume</a>
              <a href="/calendar.html">Cal</a>
            </nav>

            <div>
              <h4>Contact</h4>
              <a href="mailto:aprathapa01@gmail.com">Email</a>
              <a href="https://linkedin.com/in/adiprathapa" target="_blank" rel="noopener noreferrer">LinkedIn</a>
              <a href="https://github.com/adiprathapa" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
          </div>
        </div>

        <div class="video-footer__bottom">
          <a href="/#top" class="video-footer__bottom-logo" aria-label="Back to hero">&#x0906;&#x0926;&#x093F;</a>
          <span>&copy; <script>document.write(new Date().getFullYear())</script> Adi Prathapa. All rights reserved.</span>
          <button type="button" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">Back to top</button>
        </div>
      </div>
    </footer>

    <script>
      document.fonts.ready.then(function () {
        var el = document.querySelector('.video-footer__word');
        if (!el) return;
        var canvas = document.createElement('canvas');
        var w = 1200, h = 740, s = 2;
        canvas.width = w * s;
        canvas.height = h * s;
        var ctx = canvas.getContext('2d');
        ctx.scale(s, s);
        ctx.font = '600 620px "Poppins"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = 'white';
        ctx.fillText('आदि', w / 2, 690);
        var url = 'url(' + canvas.toDataURL('image/png') + ')';
        el.style.webkitMaskImage = url;
        el.style.maskImage = url;
        el.style.visibility = 'visible';

        var v = el.querySelector('video');
        if (v) v.play().catch(function () { /* no-op */ });
      });
    </script>
  </body>
</html>
